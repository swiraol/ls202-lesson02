<!DOCTYPE html>
<html lang="en">
  <head>
    <style>
      html {
        font-size: 20px;
      }
      div {
        width: 300px;
        height: 300px;
        box-sizing: border-box;
        display: inline-block;
      }
      .red {
        background-color: red;
        padding: 20px;
      }

      .blue {
        border: 5px solid black;
        background-color: blue;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div class="red"></div>
    <div class="blue"></div>
  </body>
</html>
